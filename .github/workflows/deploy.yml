name: Deploy Angular (Hash) to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: npm ci

      - name: Run Unit Tests
        run: npm test

      - name: Build Angular
        run: npm run build -- --base-href "/${{ github.event.repository.name }}/"

      - name: Generate Compodoc documentation
        run: npx compodoc -p tsconfig.app.json -d dist/angular-hash-pages/browser/documentation

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist/angular-hash-pages/browser

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  verify:
    runs-on: ubuntu-latest
    needs: deploy

    steps:
      - name: Verify the app responds after deployment
        run: |
          URL="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/"
          echo "Verifying $URL"
          curl --fail --silent --show-error --location \
            --retry 10 --retry-delay 15 --retry-all-errors \
            --output page.html "$URL"
          grep -qi "<app-root" page.html
          echo "OK: the application is available and responding"